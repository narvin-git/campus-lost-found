# XAMPP Apache (port 80) -> Node/Express (port 3000) reverse proxy
#
# 1. In C:\xampp\apache\conf\httpd.conf make sure these two lines are NOT commented:
#      LoadModule proxy_module modules/mod_proxy.so
#      LoadModule proxy_http_module modules/mod_proxy_http.so
# 2. Append this block to C:\xampp\apache\conf\extra\httpd-vhosts.conf
# 3. Restart Apache in the XAMPP Control Panel.

<VirtualHost *:80>
    ServerName localhost

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    ErrorLog  "logs/lostfound-error.log"
    CustomLog "logs/lostfound-access.log" common
</VirtualHost>
